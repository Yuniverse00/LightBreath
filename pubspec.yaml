name: sense2quit
description: A smoking cessation application using Flutter.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.6 <4.0.0'
  flutter: ">=3.3.0+hotfix.6"

dependencies:
  flutter:
    sdk: flutter
  amplify_flutter: 1.0.0
  amplify_auth_cognito: 1.0.0
  amplify_datastore: 1.0.0-supports-only-mobile.0+1
  amplify_api: 1.0.0

  # ========== 新增 Firebase 核心依赖 ==========
  # Firebase 初始化核心
  #firebase_core: ^2.24.2
  # Firestore 数据库（实现用户信息互通）
  #cloud_firestore: ^4.13.6
  # 可选：若需要 Firebase 认证（替代 Amplify Auth）
  #firebase_auth: ^4.15.1

  youtube_player_flutter: ^8.1.2
  fluttertoast: 8.2.2
  cupertino_icons: ^1.0.2
  provider: ^6.0.5
  email_validator: ^2.1.17
  get_it: ^7.6.0
  flutter_bloc: ^8.1.3
  flutter_wear_os_connectivity: ^1.0.0
  flutter_switch: ^0.3.2
  graphql_flutter: ^5.1.2
  intl: ^0.18.1
  shared_preferences: ^2.2.1
  assets_audio_player: ^3.1.1
  fl_chart: ^0.55.2
  image_picker: ^1.0.7
  video_player: ^2.8.4
  chewie: ^1.0.0+1
  audioplayers: ^5.2.1
  path_provider: ^2.1.2
  open_filex: ^4.4.0
  path: ^1.8.3
  record: ^5.0.1
  webview_flutter: ^4.4.4
  flutter_reactive_ble: ^5.3.1
  permission_handler: ^11.3.1
  just_audio: ^0.9.36


dev_dependencies:
  flutter_test:
    sdk: flutter
  intl: ^0.18.1
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - lib/assets/
    - lib/games/pacman/assets/
    - lib/games/pacman/assets/images/
